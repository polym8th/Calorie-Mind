[providers]
python = "3.9"

[phases.setup]
nixPkgs = ["python39", "pip"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "python manage.py"

[variables]
PYTHON_VERSION = "3.9"
FLASK_APP = "manage.py"
