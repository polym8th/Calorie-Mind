[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calorie-mind"
version = "1.0.0"
description = "A Flask web application for tracking calorie intake and nutrition goals"
requires-python = ">=3.9"
dependencies = [
    "Flask",
    "gspread",
    "requests",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "python-dotenv"
]

[project.scripts]
calorie-mind = "manage:main"
